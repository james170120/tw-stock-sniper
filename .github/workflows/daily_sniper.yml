name: Daily Stock Sniper

on:
  workflow_dispatch: # 僅允許 API 或手動觸發

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝所需套件 (requests, yfinance, pandas)
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas
          
      - name: 執行每日狙擊腳本
        run: python daily_sniper.py
